# .github/workflows/deploy-dev.yml
name: Deploy to Dev

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main
  push:
    branches: [ main ]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Kind cluster for testing
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: mlops-dev
        wait: 120s

    - name: Create namespace
      run: |
        kubectl create namespace mlops-dev --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy PostgreSQL
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm install postgres bitnami/postgresql -n mlops-dev \
          --set auth.postgresPassword=postgres \
          --set auth.database=mlops \
          --set primary.resources.requests.memory=256Mi \
          --set primary.resources.requests.cpu=100m \
          --wait --timeout=5m

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f deploy/k8s/namespace.yaml || true
        kubectl apply -f deploy/k8s/deployment.yaml -n mlops-dev
        kubectl apply -f deploy/k8s/service.yaml -n mlops-dev

    - name: Update deployment with new image
      run: |
        IMAGE_TAG="ghcr.io/${{ github.repository }}/titanic-predictor:main-${{ github.sha }}"
        
        echo "🚀 Deploying image: $IMAGE_TAG"
        
        kubectl set image deployment/titanic-predictor \
          titanic-api=$IMAGE_TAG \
          -n mlops-dev || echo "Deployment update skipped (may not exist yet)"

    - name: Wait for pods to be ready
      run: |
        kubectl wait --for=condition=ready pod -l app=titanic-predictor -n mlops-dev --timeout=300s

    - name: Show deployment status
      run: |
        echo "📊 Deployment status:"
        kubectl get pods -n mlops-dev -l app=titanic-predictor
        kubectl get deployment titanic-predictor -n mlops-dev

    - name: Smoke test - Health Check
      run: |
        echo "🏥 Running health check smoke test..."
        
        kubectl port-forward svc/titanic-predictor 8000:8000 -n mlops-dev &
        PF_PID=$!
        sleep 15
        
        for i in {1..5}; do
          if curl -sf http://localhost:8000/healthz; then
            echo "✅ Health check passed"
            kill $PF_PID || true
            exit 0
          fi
          echo "⏳ Attempt $i/5 - retrying in 5s..."
          sleep 5
        done
        
        kill $PF_PID || true
        exit 1

    - name: Smoke test - Sample Prediction
      run: |
        echo "🔮 Running prediction smoke test..."
        
        kubectl port-forward svc/titanic-predictor 8000:8000 -n mlops-dev &
        PF_PID=$!
        sleep 10
        
        RESPONSE=$(curl -sf -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{
            "pclass": 1,
            "sex": "female",
            "age": 29.0,
            "sibsp": 0,
            "parch": 0,
            "fare": 100.0,
            "embarked": "C"
          }')
        
        echo "Response: $RESPONSE"
        
        if echo "$RESPONSE" | grep -q "prediction"; then
          echo "✅ Prediction endpoint working"
        else
          echo "❌ Prediction endpoint failed"
          kill $PF_PID || true
          exit 1
        fi
        
        kill $PF_PID || true

    - name: Deployment summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎉 Deployment to dev completed successfully"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 Image: ghcr.io/${{ github.repository }}/titanic-predictor:main-${{ github.sha }}"
        echo "🌐 Namespace: mlops-dev"
        echo "✅ Health check: PASSED"
        echo "✅ Prediction test: PASSED"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"