name: Deploy to Dev

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Kubernetes manifests exist
      run: |
        echo "✅ Checking Kubernetes manifest files..."
        
        if [ -f "deploy/k8s/namespace.yaml" ]; then
          echo "✅ namespace.yaml exists"
        else
          echo "❌ namespace.yaml not found"
          exit 1
        fi
        
        if [ -f "deploy/k8s/deployment.yaml" ]; then
          echo "✅ deployment.yaml exists"
        else
          echo "❌ deployment.yaml not found"
          exit 1
        fi
        
        if [ -f "deploy/k8s/service.yaml" ]; then
          echo "✅ service.yaml exists"
        else
          echo "❌ service.yaml not found"
          exit 1
        fi

    - name: Simulate namespace creation
      run: |
        echo "📦 Would create namespace with:"
        echo "kubectl create namespace mlops-dev --dry-run=client -o yaml"
        echo ""
        cat deploy/k8s/namespace.yaml

    - name: Simulate deployment to dev
      run: |
        IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:${{ github.sha }}"
        echo "🚀 Would deploy to mlops-dev namespace with:"
        echo ""
        echo "kubectl apply -f deploy/k8s/namespace.yaml"
        echo "kubectl apply -f deploy/k8s/deployment.yaml -n mlops-dev"
        echo "kubectl apply -f deploy/k8s/service.yaml -n mlops-dev"
        echo ""
        echo "kubectl set image deployment/titanic-predictor \\"
        echo "  titanic-predictor=$IMAGE_TAG \\"
        echo "  -n mlops-dev"
        echo ""
        echo "kubectl rollout status deployment/titanic-predictor -n mlops-dev --timeout=5m"

    - name: Simulate smoke test - Health check
      run: |
        echo "🏥 Would run health check smoke test:"
        echo ""
        echo "kubectl port-forward svc/titanic-predictor 8000:8000 -n mlops-dev &"
        echo "sleep 5"
        echo ""
        echo "response=\$(curl -s -w '%{http_code}' http://localhost:8000/healthz)"
        echo "if [ \"\$response\" = \"200\" ]; then"
        echo "  echo '✅ Health check passed'"
        echo "else"
        echo "  echo '❌ Health check failed'"
        echo "  exit 1"
        echo "fi"

    - name: Simulate smoke test - Prediction
      run: |
        echo "🔮 Would run prediction smoke test:"
        echo ""
        echo "response=\$(curl -s -X POST http://localhost:8000/predict \\"
        echo "  -H 'Content-Type: application/json' \\"
        echo "  -d '{\"pclass\":1,\"sex\":\"female\",\"age\":29,\"sibsp\":0,\"parch\":0,\"fare\":100,\"embarked\":\"C\"}')"
        echo ""
        echo "if echo \"\$response\" | grep -q \"prediction\"; then"
        echo "  echo '✅ Prediction endpoint working'"
        echo "else"
        echo "  echo '❌ Prediction endpoint failed'"
        echo "  exit 1"
        echo "fi"

    - name: Deployment summary
      run: |
        echo "════════════════════════════════════════"
        echo "✅ Dev Deployment Validation Complete"
        echo "════════════════════════════════════════"
        echo ""
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:${{ github.sha }}"
        echo "🏷️  Namespace: mlops-dev"
        echo "🚀 Deployment: titanic-predictor"
        echo "🔗 Service: titanic-predictor (port 8000)"
        echo ""
        echo "In production environment, this would:"
        echo "  1. Create mlops-dev namespace"
        echo "  2. Deploy application to mlops-dev"
        echo "  3. Run health check smoke test"
        echo "  4. Run prediction smoke test"
        echo "  5. Verify deployment rollout"
        echo ""
        echo "════════════════════════════════════════"