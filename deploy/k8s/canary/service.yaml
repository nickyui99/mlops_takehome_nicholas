apiVersion: v1
kind: Service
metadata:
  name: titanic-predictor
  labels:
    app: titanic-predictor
spec:
  selector:
    app: titanic-predictor
    # No version selector - routes to both stable and canary
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
