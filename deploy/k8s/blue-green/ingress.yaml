apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: titanic-predictor
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - titanic-predictor.example.com
    secretName: titanic-predictor-tls
  rules:
  - host: titanic-predictor.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: titanic-predictor  # Routes to whichever version service points to
            port:
              number: 80
