apiVersion: apps/v1
kind: Deployment
metadata:
  name: titanic-predictor-blue
  labels:
    app: titanic-predictor
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: titanic-predictor
      version: blue
  template:
    metadata:
      labels:
        app: titanic-predictor
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: titanic-predictor
        image: titanic-predictor:v1.0  # Blue version (local image)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DB_HOST
          value: "postgres-postgresql.mlops-dev.svc.cluster.local"
        - name: MODEL_NAME
          value: "titanic-classifier"
        - name: MODEL_VERSION
          value: "1.0"
        - name: MLFLOW_TRACKING_URI
          value: "sqlite:///mlflow.db"
        - name: DEPLOYMENT_TYPE
          value: "blue"
        - name: DEPLOYMENT_COLOR
          value: "blue"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
