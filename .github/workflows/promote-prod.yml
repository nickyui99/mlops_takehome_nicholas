# .github/workflows/promote-prod.yml
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - canary
          - blue-green
        default: 'canary'
      canary_percentage:
        description: 'Canary traffic percentage (only for canary strategy)'
        required: false
        default: '25'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
      image_tag:
        description: 'Image tag to deploy (leave empty for latest)'
        required: false
        default: 'latest'

jobs:
  canary-deployment:
    if: ${{ github.event.inputs.deployment_strategy == 'canary' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate canary manifests exist
      run: |
        echo "✅ Checking canary deployment manifest files..."
        
        if [ -f "deploy/k8s/canary/deployment-canary.yaml" ]; then
          echo "✅ deployment-canary.yaml exists"
        else
          echo "❌ deployment-canary.yaml not found"
          exit 1
        fi
        
        if [ -f "deploy/k8s/canary/deployment-stable.yaml" ]; then
          echo "✅ deployment-stable.yaml exists"
        else
          echo "❌ deployment-stable.yaml not found"
          exit 1
        fi

    - name: Simulate namespace and stable deployment
      run: |
        echo "📦 Would create namespace with:"
        echo "kubectl create namespace mlops-prod"
        echo ""
        echo "📦 Would deploy stable version with:"
        echo "kubectl apply -f deploy/k8s/deployment.yaml -n mlops-prod"
        echo "kubectl apply -f deploy/k8s/service.yaml -n mlops-prod"

    - name: Simulate canary deployment
      run: |
        IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        if [ "$IMAGE_TAG" = "latest" ]; then
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:latest"
        else
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:$IMAGE_TAG"
        fi
        
        CANARY_PERCENT=${{ github.event.inputs.canary_percentage }}
        CANARY_REPLICAS=1
        
        echo "🐤 Would deploy canary with $CANARY_REPLICAS replica(s) (~$CANARY_PERCENT% traffic)"
        echo "📦 Image: $IMAGE_TAG"
        echo ""
        echo "Commands that would run:"
        echo "kubectl apply -f deploy/k8s/canary/deployment-canary.yaml -n mlops-prod"
        echo "kubectl set image deployment/titanic-predictor-canary titanic-predictor=$IMAGE_TAG -n mlops-prod"
        echo "kubectl scale deployment/titanic-predictor-canary --replicas=$CANARY_REPLICAS -n mlops-prod"
        echo "kubectl rollout status deployment/titanic-predictor-canary -n mlops-prod --timeout=5m"

    - name: Simulate canary metrics monitoring
      run: |
        echo "📊 Would monitor canary metrics for 2 minutes..."
        echo ""
        echo "Prometheus queries that would run:"
        echo "  - Error rate: rate(http_requests_total{status=~\"5..\",version=\"canary\"}[5m])"
        echo "  - Latency p95: histogram_quantile(0.95, http_request_duration_seconds{version=\"canary\"})"
        echo "  - Request success rate: sum(rate(http_requests_total{status=\"200\",version=\"canary\"}[5m]))"
        echo ""
        echo "✅ Simulated monitoring complete - canary metrics acceptable"

    - name: Simulate canary smoke tests
      run: |
        echo "🧪 Would run canary smoke tests..."
        echo ""
        echo "Test commands that would run:"
        echo "kubectl port-forward svc/titanic-predictor 8000:8000 -n mlops-prod &"
        echo "curl -X POST http://localhost:8000/predict -H 'X-Canary: true' -d '{...}'"
        echo ""
        echo "✅ Simulated smoke tests passed"

    - name: Simulate canary promotion
      run: |
        IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        if [ "$IMAGE_TAG" = "latest" ]; then
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:latest"
        else
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:$IMAGE_TAG"
        fi
        
        echo "🚀 Would promote canary to stable deployment..."
        echo ""
        echo "Commands that would run:"
        echo "kubectl set image deployment/titanic-predictor titanic-predictor=$IMAGE_TAG -n mlops-prod"
        echo "kubectl rollout status deployment/titanic-predictor -n mlops-prod --timeout=5m"
        echo "kubectl delete deployment/titanic-predictor-canary -n mlops-prod"
        echo ""
        echo "✅ Simulated canary promotion complete"

    - name: Simulate post-deployment verification
      run: |
        echo "🔍 Would run post-deployment verification..."
        echo ""
        echo "Verification commands that would run:"
        echo "kubectl port-forward svc/titanic-predictor 8000:8000 -n mlops-prod &"
        echo "curl http://localhost:8000/healthz"
        echo "curl -X POST http://localhost:8000/predict -d '{...}'"
        echo ""
        echo "✅ Simulated production verification complete"

    - name: Deployment summary
      run: |
        echo "════════════════════════════════════════"
        echo "✅ Canary Deployment Complete"
        echo "════════════════════════════════════════"
        echo ""
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:${{ github.event.inputs.image_tag }}"
        echo "🏷️  Namespace: mlops-prod"
        echo "🐤 Strategy: Canary (${{ github.event.inputs.canary_percentage }}%)"
        echo ""
        echo "In production environment, this would:"
        echo "  1. Deploy canary with ${{ github.event.inputs.canary_percentage }}% traffic"
        echo "  2. Monitor metrics for 2 minutes"
        echo "  3. Run smoke tests on canary"
        echo "  4. Promote canary to 100% if healthy"
        echo "  5. Remove canary deployment"
        echo ""
        echo "════════════════════════════════════════"

  blue-green-deployment:
    if: ${{ github.event.inputs.deployment_strategy == 'blue-green' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate blue-green manifests exist
      run: |
        echo "📋 Validating Blue-Green manifest files..."
        
        if [ ! -f "deploy/k8s/blue-green/deployment-blue.yaml" ]; then
          echo "❌ Missing deployment-blue.yaml"
          exit 1
        fi
        
        if [ ! -f "deploy/k8s/blue-green/deployment-green.yaml" ]; then
          echo "❌ Missing deployment-green.yaml"
          exit 1
        fi
        
        if [ ! -f "deploy/k8s/blue-green/service-blue.yaml" ]; then
          echo "❌ Missing service-blue.yaml"
          exit 1
        fi
        
        if [ ! -f "deploy/k8s/blue-green/service-green.yaml" ]; then
          echo "❌ Missing service-green.yaml"
          exit 1
        fi
        
        if [ ! -f "deploy/k8s/blue-green/ingress.yaml" ]; then
          echo "❌ Missing ingress.yaml"
          exit 1
        fi
        
        echo "✅ All Blue-Green manifests present"

    - name: Simulate Blue environment (current production)
      run: |
        echo "🔵 Would deploy Blue environment (current production)..."
        echo ""
        echo "Commands that would run:"
        echo "kubectl apply -f deploy/k8s/blue-green/deployment-blue.yaml -n mlops-prod"
        echo "kubectl apply -f deploy/k8s/blue-green/service-blue.yaml -n mlops-prod"
        echo "kubectl rollout status deployment/titanic-predictor-blue -n mlops-prod --timeout=5m"
        echo ""
        echo "✅ Blue environment would be running"

    - name: Simulate Green environment deployment
      run: |
        IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        if [ "$IMAGE_TAG" = "latest" ]; then
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:latest"
        else
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:$IMAGE_TAG"
        fi
        
        echo "🟢 Would deploy Green environment (new version)..."
        echo ""
        echo "📦 Image: $IMAGE_TAG"
        echo ""
        echo "Commands that would run:"
        echo "kubectl apply -f deploy/k8s/blue-green/deployment-green.yaml -n mlops-prod"
        echo "kubectl set image deployment/titanic-predictor-green titanic-predictor=$IMAGE_TAG -n mlops-prod"
        echo "kubectl rollout status deployment/titanic-predictor-green -n mlops-prod --timeout=5m"
        echo ""
        echo "✅ Green environment would be deployed"

    - name: Simulate Green environment tests
      run: |
        echo "🧪 Would test Green environment before cutover..."
        echo ""
        echo "Test commands that would run:"
        echo "kubectl expose deployment titanic-predictor-green --name=titanic-green-test --port=8000 -n mlops-prod"
        echo "kubectl port-forward svc/titanic-green-test 8001:8000 -n mlops-prod &"
        echo "curl http://localhost:8001/healthz"
        echo "curl -X POST http://localhost:8001/predict -d '{...}'"
        echo "kubectl delete service titanic-green-test -n mlops-prod"
        echo ""
        echo "✅ Green environment tests would pass"

    - name: Simulate traffic cutover
      run: |
        echo "🔀 Would switch production traffic to Green..."
        echo ""
        echo "Command that would run:"
        echo "kubectl patch service titanic-predictor -n mlops-prod -p '{\"spec\":{\"selector\":{\"version\":\"green\"}}}'"
        echo ""
        echo "Result: Instant cutover (<5 seconds downtime)"
        echo "  • Blue pods: Stopped receiving traffic"
        echo "  • Green pods: Now serving 100% of production traffic"
        echo ""
        echo "✅ Traffic would be switched to Green"

    - name: Simulate post-cutover verification
      run: |
        echo "🧪 Would run post-cutover verification..."
        echo ""
        echo "Verification commands that would run:"
        echo "kubectl port-forward svc/titanic-predictor 8000:8000 -n mlops-prod &"
        echo "curl http://localhost:8000/healthz"
        echo "curl -X POST http://localhost:8000/predict -d '{...}'"
        echo ""
        echo "Expected: Green environment serving all production traffic"
        echo ""
        echo "✅ Production verification would pass on Green"

    - name: Simulate Blue cleanup
      run: |
        echo "⏳ In production, would wait 15-30 minute soak period..."
        echo ""
        echo "After soak period, cleanup commands that would run:"
        echo "kubectl delete deployment titanic-predictor-blue -n mlops-prod"
        echo "kubectl delete service titanic-predictor-blue -n mlops-prod"
        echo ""
        echo "Note: Blue environment kept alive during soak period for fast rollback"
        echo ""
        echo "✅ Blue environment would be removed"

    - name: Deployment summary
      run: |
        echo "════════════════════════════════════════"
        echo "✅ Blue-Green Deployment Complete"
        echo "════════════════════════════════════════"
        echo ""
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:${{ github.event.inputs.image_tag }}"
        echo "🏷️  Namespace: mlops-prod"
        echo "🔄 Strategy: Blue-Green (instant cutover)"
        echo ""
        echo "In production environment, this would:"
        echo "  1. Keep Blue (old version) running"
        echo "  2. Deploy Green (new version) alongside"
        echo "  3. Test Green thoroughly before cutover"
        echo "  4. Switch traffic instantly (<5s)"
        echo "  5. Monitor Green during soak period"
        echo "  6. Remove Blue after 15-30 minutes"
        echo ""
        echo "Advantages:"
        echo "  ✓ Zero-downtime deployment"
        echo "  ✓ Instant rollback capability"
        echo "  ✓ Pre-cutover testing"
        echo "  ✓ Full isolation between versions"
        echo ""
        echo "════════════════════════════════════════"

  deployment-summary:
    needs: [canary-deployment, blue-green-deployment]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎉 Production Promotion Workflow Complete"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "Strategy: ${{ github.event.inputs.deployment_strategy }}"
        echo "Image: ghcr.io/${{ github.repository_owner }}/mlops_takehome_nicholas:${{ github.event.inputs.image_tag }}"
        if [ "${{ github.event.inputs.deployment_strategy }}" = "canary" ]; then
          echo "Canary %: ${{ github.event.inputs.canary_percentage }}%"
        fi
        echo ""
        echo "⚠️  Note: This is a simulation workflow"
        echo "In a production environment with a real K8s cluster:"
        echo "  • Manifests would be applied with kubectl"
        echo "  • Pods would be deployed and health-checked"
        echo "  • Traffic would be routed per selected strategy"
        echo "  • Metrics would be monitored via Prometheus"
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"